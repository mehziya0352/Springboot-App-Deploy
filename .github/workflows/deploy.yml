name: final deploy

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_DIR: terraform

jobs:
  infra-setup:
    runs-on: ubuntu-latest
    outputs:
      app_ip: ${{ steps.app.outputs.app_ip }}

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.6"

      # Step 3: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Backend
        run: |
          chmod +x ./create-backend.sh
          ./create-backend.sh

      # Step 4: Terraform init
      - name: Terraform init
        working-directory: ./terraform/
        run: terraform init

      # Step 5: Terraform apply
      - name: Terraform apply
        working-directory: ./terraform/
        run: terraform apply -auto-approve -lock=false

      # Step 6: Save Terraform output
      - name: Save Terraform output
        working-directory: ./terraform/
        run: terraform output -json > tfoutput.json

      - name: Upload Terraform output
        uses: actions/upload-artifact@v4
        with:
          name: tfoutput
          path: terraform/tfoutput.json

      - name: Save APP Public IP
        id: app
        working-directory: ${{ env.TF_DIR }}
        run: |
          APP_IP=$(terraform output -raw app_public_ip)
          echo "APP_PUBLIC_IP=$APP_IP" >> $GITHUB_ENV
          echo "app_ip=$APP_IP" >> $GITHUB_OUTPUT

  ansible:
    runs-on: ubuntu-latest
    needs: infra-setup
    env:
      APP_PUBLIC_IP: ${{ needs.infra-setup.outputs.app_ip }}
    steps:
      - uses: actions/checkout@v4
      
      # Step 7: Setup Python & Ansible
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download Terraform output
        uses: actions/download-artifact@v4
        with:
          name: tfoutput
          path: terraform/


      - name: Install Ansible & MySQL collection
        run: |
          python3 -m pip install --upgrade pip
          pip install ansible PyMySQL
          ansible-galaxy collection install community.mysql

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
       # Step 10: Disable host key checking   
      - name: Disable host key checking
        run: |
          echo "Host *" > ~/.ssh/config
          echo "    StrictHostKeyChecking no" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      # Step 11: Wait for EC2 SSH to be ready
      - name: Wait for EC2 SSH to be ready
        run: sleep 30
        
      # Step 8: Generate dynamic Ansible inventory
      - name: Generate Ansible inventory
        run: |
          python3 scripts/tf-to-inventory.py terraform/tfoutput.json > ansible/inventory.ini
          cat ansible/inventory.ini

      # Step 9: Run RDS Setup Playbook
      - name: Run RDS Setup Playbook
        working-directory: ./ansible/
        env:
          vault_rds_password: ${{ secrets.RDS_PASSWORD }}
        run: |
          export ANSIBLE_ROLES_PATH=./roles
          ansible-playbook -i inventory.ini playbooks/rds.yml --private-key ~/.ssh/id_rsa -vv

