---
- name: Create RDS database
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_host: "{{ inventory_hostname }}"
    login_user: root
    login_password: "{{ vault_rds_password }}"

- name: Create RDS user
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ vault_rds_password }}"
    priv: "{{ db_name }}.*:ALL"
    host: "%"
    state: present
    login_host: "{{ inventory_hostname }}"
    login_user: root
    login_password: "{{ vault_rds_password }}"
